version: '3.8'

services:
  annotator:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./snapshots:/app/snapshots
      - ./exports:/app/exports
      - ./plugins:/app/plugins
    environment:
      - DATASET_ANNOTATOR_CONFIG=/app/config/dataset_config.yaml
      - DATASET_ANNOTATOR_DB=/app/data/annotator.db
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped

