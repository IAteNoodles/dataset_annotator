services:
  annotator:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Drop your dataset folders/images in ./dataset (mounted at /app/dataset).
      - ./dataset:/app/dataset
      # Persisted state: database, exports, snapshots, crops.
      - ./data:/app/data
      - ./exports:/app/exports
      - ./snapshots:/app/snapshots
      - ./crops:/app/crops
    environment:
      # Folder auto-opened and scanned on startup. Change at runtime in the UI.
      DATASET_ANNOTATOR_DATASET_PATH: /app/dataset
      DATASET_ANNOTATOR_CONFIG: /app/config/dataset_config.yaml
      DATASET_ANNOTATOR_DB: /app/data/annotator.db
      # Optional S3 creds (export to AWS S3 from the Operations panel)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    restart: unless-stopped