[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-annotator"
version = "1.0.0"
description = "Recovery-first dataset annotator with S3 integration"
readme = "README.md"
authors = [{name = "Dataset Annotator Team"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.3.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.3",
    "aiosqlite==0.19.0",
    "pyarrow==25.0.1",
    "pandas==3.0.5",
    "numpy==2.2.5",
    "Pillow==12.3.0",
    "boto3==1.34.0",
    "botocore==1.34.0",
    "websockets==12.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "mypy==1.9.0",
    "types-requests==2.31.0",
    "ruff==0.4.0",
    "black==24.3.0",
    "isort==5.13.0",
]

[project.scripts]
dataset-annotator = "backend.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20", "PT", "PTH", "ERA", "RET", "SIM", "TRY", "PERF"]
ignore = ["E501", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "S101", "B008"]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py311"]