<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dataset Annotator</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg: #f8fafc;
      --sidebar-width: 200px;
      --panel-width: 300px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: #1e293b;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 100vh;
      border-right: 1px solid #334155;
    }

    .sidebar h2 {
      font-size: 0.875rem;
      opacity: 0.7;
    }

    .dataset-path {
      font-size: 0.75rem;
      opacity: 0.5;
      margin-bottom: 1rem;
      word-break: break-all;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
      min-height: 400px;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
    }

    #canvas {
      border: 1px solid #e2e8f0;
      background: white;
      display: block;
      cursor: crosshair;
    }

    .panel {
      width: var(--panel-width);
      border-left: 1px solid #e2e8f0;
      padding: 1rem 1.5rem;
      background: #f1f5f9;
      overflow-y: auto;
      height: 100vh;
    }

    .panel h3 {
      margin: 0 0 1rem 0;
      font-size: 0.875rem;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.5rem;
    }

    .field-group {
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .field-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .field-group select,
    .field-group input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .field-group select:focus,
    .field-group input:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    .button-small {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      font-size: 0.875rem;
      cursor: pointer;
      margin-right: 0.5rem;
    }

    .button-small.secondary {
      background: white;
      color: #1e293b;
      border: 1px solid #cbd5e1;
    }

    .button-small.primary {
      background: var(--primary);
      color: white;
    }

    .button-small:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #annotationControls {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
    }

    .annotation-list {
      margin-top: 1rem;
    }

    .annotation-item {
      padding: 0.5rem;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .annotation-item:hover {
      background: #f1f5f9;
    }

    .annotation-item.selected {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .status-badge {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      font-size: 0.625rem;
      border-radius: 9999px;
      margin-left: 0.5rem;
    }

    .status-locked {
      background: #fef3c7;
      color: #92400e;
    }

    .status-unlocked {
      background: #dcfce7;
      color: #166534;
    }

    .toolbar {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 0.5rem;
    }

    .toolbar button {
      padding: 0.375rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .toolbar button:hover {
      background: #f1f5f9;
    }

    .toolbar button.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <h2>Dataset</h2>
      <div class="dataset-path" id="datasetPath">Loading...</div>
      <button id="clearAllBtn" class="btn-primary" style="margin-bottom:0.5rem;background:#dc2626;">Clear All Annotations</button>
      <button id="resetDbBtn" class="btn-primary" style="background:#dc2626;">Reset Entire DB</button>

      <div class="folder-row">
        <input type="text" id="folderPathInput" placeholder="Path to dataset folder..." autocomplete="off">
        <button id="openFolderBtn" class="btn-primary">Open</button>
      </div>
      <div id="treeStatus" class="tree-status"></div>

      <div id="folderTree" class="folder-tree"></div>

      <button id="operationsToggleBtn" class="btn-primary ops-toggle">Operations</button>
    </div>
    <div id="sidebarResizer" class="sidebar-resizer" title="Drag to resize"></div>

    <div class="main">
      <div class="toolbar">
        <button id="toolSelect" class="active" title="Select">Select</button>
        <button id="toolRect" title="Rectangle">Rect</button>
        <button id="toolPoint" title="Point">Point</button>
        <button id="toolLine" title="Line">Line</button>
        <span class="toolbar-spacer"></span>
        <button id="prevImgBtn" disabled title="Previous image">‹</button>
        <button id="nextImgBtn" disabled title="Next image">›</button>
        <button id="markDoneBtn" disabled>Mark Done</button>
        <span id="itemCounter" class="item-counter"></span>
      </div>
      <div class="canvas-wrapper">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
    </div>

    <div class="panel">
      <h3>Annotation</h3>
      <div id="noSelection" style="color:#94a3b8;font-size:0.875rem;">Select or create an annotation</div>
      
      <div id="cropPreview" style="display:none; margin-top:1rem;">
        <h4 style="font-size:0.75rem;color:#64748b;margin-bottom:0.5rem;">Crop Preview</h4>
        <canvas id="cropCanvas" width="250" height="250" style="border:1px solid #e2e8f0;background:#f8fafc;display:block;width:100%;"></canvas>
      </div>
      
      <div class="field-group" id="fieldGroup" style="display:none;">
        <label style="font-size:0.75rem;color:#64748b;">Field Name</label>
        <input type="text" id="fieldNameInput" list="fieldNameList" placeholder="Select or type field name..." disabled autocomplete="off">
        <datalist id="fieldNameList"></datalist>
        <label style="font-size:0.75rem;color:#64748b;">Field Value</label>
        <div id="valueWrap" class="value-wrap">
          <input type="text" id="fieldValue" placeholder="Field value" disabled autocomplete="off">
          <div id="suggestionList" class="ac-list"></div>
        </div>
        <button id="addFieldBtn" class="btn-primary" disabled style="margin-top:0.5rem;">Add Field</button>
        <div id="existingFields" class="existing-fields"></div>
      </div>
      
      <div id="annotationControls" style="display:none;">
        <button id="lockBtn" class="button-small secondary">Lock</button>
        <button id="unlockBtn" class="button-small secondary">Unlock</button>
        <button id="deleteBtn" class="button-small secondary" style="background:#dc2626;border-color:#dc2626;color:white;">Delete</button>
      </div>

      <div class="annotation-list">
        <h4 style="font-size:0.75rem;color:#64748b;margin-bottom:0.5rem;">Annotations</h4>
        <div id="annotationList"></div>
      </div>
    </div>
  </div>

  <div id="opsModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Operations</h3>
        <button id="opsCloseBtn" class="modal-close" title="Close">×</button>
      </div>
      <div class="modal-body">
        <button id="exportBtn" class="btn-primary" style="margin-bottom:0.5rem;">Export Parquet</button>
        <button id="exportS3Btn" class="btn-primary" style="margin-bottom:0.5rem;">Export → S3</button>
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
          <label for="exportMode" style="font-size:0.75rem;color:#94a3b8;">Export:</label>
          <select id="exportMode" class="s3-input" style="flex:1;">
            <option value="annotated">Only annotated images</option>
            <option value="full">All images (annotated + unannotated)</option>
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
          <input type="checkbox" id="verifyImages" style="width:auto;">
          <label for="verifyImages" style="font-size:0.75rem;color:#94a3b8;">Verify exported images (hash check)</label>
        </div>
        <div style="margin-top:0.5rem;">
          <label class="s3-label">AWS Region</label>
          <input type="text" id="s3Region" class="s3-input" placeholder="us-east-1" autocomplete="off">
          <label class="s3-label">Access Key</label>
          <input type="text" id="s3AccessKey" class="s3-input" placeholder="AKIA..." autocomplete="off">
          <label class="s3-label">Secret Key</label>
          <input type="password" id="s3SecretKey" class="s3-input" placeholder="..." autocomplete="off">
          <label class="s3-label">Bucket</label>
          <input type="text" id="s3Bucket" class="s3-input" placeholder="my-dataset-bucket" autocomplete="off">
          <label class="s3-label">Endpoint URL (optional)</label>
          <input type="text" id="s3Endpoint" class="s3-input" placeholder="https://..." autocomplete="off">
          <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
            <button id="s3SaveBtn" class="button-small secondary">Save Config</button>
            <button id="s3TestBtn" class="button-small secondary">Test</button>
          </div>
          <div id="exportStatus" class="export-status" style="margin-top:0.5rem;"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="exportConfirmModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Confirm Export</h3>
        <button id="exportConfirmClose" class="modal-close" title="Close">×</button>
      </div>
      <div class="modal-body">
        <div id="exportConfirmSummary" style="font-size:0.8rem;line-height:1.7;"></div>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;justify-content:flex-end;">
          <button id="exportConfirmCancel" class="button-small secondary">Cancel</button>
          <button id="exportConfirmOk" class="btn-primary">Start Export</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
